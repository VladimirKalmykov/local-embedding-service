[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-embedding-service"
version = "0.1.0"
description = "Local per-user HTTP service for reusable text embeddings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastembed==0.9.0",
]

[project.scripts]
local-embedding-service = "local_embedding_service.server:main"

[tool.setuptools.packages.find]
where = ["src"]

